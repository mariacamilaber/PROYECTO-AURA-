<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>
  <div class="contenedor">
    <!-- Panel izquierdo -->
    <div class="panel-login">
      <img src="../img/logo.png" alt="Logo AURA">
      <form class="formulario-login">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
        <div class="encabezado-password">
          <label for="password">Contraseña</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <input type="password" id="password" placeholder="Ingresa 5 caracteres o más">

        <div class="recordarme">
          <input type="checkbox" id="recordar">
          <label for="recordar">Recordarme</label>
        </div>
        <button type="submit">INICIAR SESIÓN</button>
      </form>
    </div>

    <!-- Panel derecho -->
    <div class="panel-bienvenida">
      <img src="../img/Gemini_Generated_Image_du6j5fdu6j5fdu6j.png" alt="logo">
    </div>
  </div>
  </div>
</body>
</html>
