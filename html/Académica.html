<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Caracterización Estudiantil</title>


    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/Académico.css">
</head>

<body>

    <!-- Caja principal -->
    <div class="caja-principal">

        <!-- Parte superior con el título -->
        <header class="parte-superior">
            <a href="#" class="boton-volver">Volver</a>

            <!-- Logo de AURA -->
            <img src="/img/logo.png
            
            " alt="Logo de AURA" class="logo-aura">

            <h1>Formulario de Caracterización Estudiantil</h1>

        </header>


        <section class="menu-secciones">


            <div class="seccion-menu">
                <div class="circulo-icono">
                    <i class="bx bx-user"></i>
                </div>
                <p>Datos Personales</p>
            </div>


            <div class="seccion-menu seccion-activa">
                <div class="circulo-icono">
                    <i class="bx bx-book-open"></i>
                </div>
                <p>Información Académica</p>
            </div>

            <div class="seccion-menu">
                <div class="circulo-icono">
                    <i class="bx bx-briefcase"></i>
                </div>
                <p>Situación Socioeconómica</p>
            </div>

            <div class="seccion-menu">
                <div class="circulo-icono">
                    <i class="bx bx-brain"></i>
                </div>
                <p>Aspectos Psicosociales</p>
            </div>

            <div class="seccion-menu">
                <div class="circulo-icono">
                    <i class="bx bx-first-aid"></i>
                </div>
                <p>Salud y Bienestar</p>
            </div>

        </section>

        <!-- Formulario -->
        <section class="seccion-formulario">

            <h2>Información Académica</h2>

<!-- Quitar comentario para mostrar los campos de nombre e identificación, si se necesitan 
            <label for="nombre">Nombre Completo *</label>
            <input type="text" id="nombre" placeholder="Ingrese su nombre completo">


            <label for="identificacion">Número de Identificación *</label>
            <input type="text" id="identificacion" placeholder="Ingrese su número de identificación"> -->

            <div class="grupo">
                        <label>Semestre Actual *</label>

                        <select>
                            <option>Seleccione</option>
                            <option>1° Semestre</option>
                            <option>2° Semestre</option>
                            <option>3° Semestre</option>
                            <option>4° Semestre</option>
                        </select>
                    </div>

                    <div class="grupo">
                        <label>Promedio Académico *</label>
                        <input type="text" placeholder="Ej: 0.0 - 5.0">  <!-- Con esto se pone un mensaje en la casilla-->
                    </div>

                <div class="campo-formulario">
                    <label for="genero">Género *</label>
                    <select id="genero">
                        <option>Seleccione</option>
                        <option>Masculino</option>
                        <option>Femenino</option>
                        <option>Otro</option>
                    </select>
                </div>
                <div class="grupo">
                    <label>Porcentaje de Asistencia *</label>

                    <select>
                        <option>Seleccione</option>
                        <option>Menos del 50%</option>
                        <option>50% - 70%</option>
                        <option>70% - 90%</option>
                        <option>Más del 90%</option>
                        <option>Nunca falto</option>
                    </select>
                </div>

                <div class="grupo">
                    <label>Horas de Estudio Diarias *</label>

                    <select>
                        <option>Seleccione</option>
                        <option>Menos de 1 hora</option>
                        <option>1 - 2 horas</option>
                        <option>2 - 3 horas</option>
                        <option>Más de 3 horas</option>
                    </select>
                </div>

            </div>

        </section>

<section class="seccion-botones">
  <button class="boton-anterior" onclick="location.href='datos.html'">Anterior</button>
  <button class="boton-siguiente" onclick="location.href='Socioeconomicos.html'">Siguiente</button>
</section>

</body>

</html>
