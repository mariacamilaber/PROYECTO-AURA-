<!DOCTYPE html>
<html lang="en">
<head>
      <form action="/procesar_inscripcion" method="POST"></form>
      <meta http-equiv="X-UA-Compatible" content="IE-edge">
      <meta charset="UTF=8">
      <meta name="viewport" content="widht-device-width, initial-scale=1.0">
      <title>Aura Formulario</title>
      <link rel="stylesheet" href="/css/formulario.css">
</head>
<body>
  <div class="Formulario">
    <h1>Inicio de sesión</h1>
     <form method="post">
    <div class="username">
       <input type="text" required>
       <label>Nombre Completo</label>
    </div>
    <div>
    <label for="codigo_estudiante">Código de Estudiante:</label>
    <input type="text" id="codigo_estudiante" name="codigo_estudiante" required pattern="[0-9]{5,10}" title="El código debe contener entre 5 y 10 números.">
  </div>
    <div class="Contraseña">
      <input type="password" required>
      <label>Contraseña</label>
      </div>
      <div class="recordar">¿Olvidó su Contraseña?</div>
      <input type="Submit"  value="Iniciar">
      <div class="Registrarse">
      Quiero hacer el <a href="#">registro</a>
      </div>
     </form>

  </div>
</body>
</html>
